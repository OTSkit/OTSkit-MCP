name: OTSkit — Bitcoin Timestamps
description: Stamp, upgrade, and verify Bitcoin timestamps via AI agents. Uses OpenTimestamps protocol against public calendars. No API keys required.
license: MIT
categories:
  - blockchain
  - bitcoin
  - timestamps
  - cryptography

startCommand:
  type: stdio
  command: npx
  args:
    - "-y"
    - "@otskit/mcp"
    - "serve"
